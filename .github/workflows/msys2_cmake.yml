
name: msys2cmake

on: 
  workflow_dispatch:

permissions:
  contents: read

jobs:
 msys2_cmake:
    runs-on: windows-2025-vs2026
    defaults:
      run:
        shell: msys2 {0}
    env:
      PYTHONIOENCODING: "utf-8"
    steps:
    - uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: base-devel git  mingw-w64-ucrt-x86_64-toolchain mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-python-pillow mingw-w64-ucrt-x86_64-meson mingw-w64-ucrt-x86_64-doxygen
    - uses: actions/checkout@v6
    - name: Build libdwarf
      run: |
        mkdir builddir && cd builddir
        cmake -G Ninja -DCMAKE_INSTALL_PREFIX=/c/msys64/usr -DBUILD_DWARFEXAMPLE=ON -DDO_TESTING=ON -DINSTALL_STATIC_LIBRARIES=YES ../CMakeLists.txt
        ninja
        ninja install
        ninja test


